name: Supply Chain Forecasting

entries:
  - title: Supply Chain Forecasting
    label: supply-chain-forecasting-demo
    short_description: |
      Procurement price forecasting on Cloudera AI with two sklearn HistGradientBoosting models—dense monthly demand vs sparse intermittent buys—and a minimal model API pattern like CML AMP Churn Prediction.
    long_description: |
      This AMP demonstrates training and deploying procurement forecasts from CSV logistics data on Cloudera AI Workbench and Models.

      You train two sklearn.ensemble.HistGradientBoostingRegressor models: one for regular monthly-style demand (rolling multi-step horizon) and one for rare purchases (next-event price from gap, market, and supplier features). Models are saved as joblib artifacts and served through model_api.predict with actions for health, forecast_dense, and forecast_sparse. Dependencies stay minimal—cdsw-build.sh installs requirements.txt only—and optional Streamlit UI is available for exploration.

